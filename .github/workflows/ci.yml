name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Check isolated features
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features server
          cargo check --no-default-features --features axum
      - name: Client and bare server stay free of axum and hyper
        run: |
          for features in client server; do
            vcmp_dependencies=$(cargo tree --no-default-features --features "$features" --edges normal --prefix none)
            if printf '%s\n' "$vcmp_dependencies" | grep -Eq '^(axum|hyper|hyper-util) v'; then
              exit 1
            fi
          done
      - name: Test (all features)
        run: cargo test --all-features

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vcmp-rs
        uses: actions/checkout@v4
        with:
          path: vcmp-rs
      - name: Checkout vcmp-spring (sibling, for the Java contract peer)
        uses: actions/checkout@v4
        with:
          repository: variocube/vcmp-spring
          path: vcmp-spring
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vcmp-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the vcmp-js peer
        working-directory: vcmp-rs/contract/js
        run: npm ci
      - name: Build the vcmp-spring peer
        working-directory: vcmp-rs/contract/java
        run: ./gradlew installDist
      - name: Contract tests (Rust ↔ vcmp-js, Rust ↔ vcmp-spring)
        working-directory: vcmp-rs
        run: cargo test --features "client server axum" --test contract_js --test contract_java -- --ignored
