# Static musl builds with the toolchain's own linker (rust-lld): no cross gcc needed, pure Rust.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-self-contained=yes", "-C", "linker-flavor=ld.lld", "-C", "linker=rust-lld"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-self-contained=yes", "-C", "linker-flavor=ld.lld", "-C", "linker=rust-lld"]

[target.armv7-unknown-linux-musleabihf]
rustflags = ["-C", "link-self-contained=yes", "-C", "linker-flavor=ld.lld", "-C", "linker=rust-lld"]
